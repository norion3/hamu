<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 【最重要】相対パスの解決先をGitHubへ固定 (連鎖読み込み迷子対策) -->
    <base href="https://norion3.github.io/hamu/">
    
    <title>よけて！ハムスター (GRAVITY Loader)</title>
    
    <!-- 外部ライブラリの読み込み -->
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- メインロジックの動的読み込み (キャッシュ最適化) -->
    <script type="module">
        // GRAVITYの仕様書に準拠：5分単位（300,000ミリ秒）で切り替わるキャッシュバスター
        const cacheBuster = Math.floor(new Date().getTime() / 300000);
        
        // iOS WebKitのバグ回避のため、起点のインポート自体も絶対パスで直接狙い撃ちする
        import(`https://norion3.github.io/hamu/main.js?t=${cacheBuster}`).catch(err => {
            console.error("[GRAVITY Loader Error] main.js の読み込みに失敗しました:", err);
            document.body.innerHTML = `<div style="color:red; padding:20px; font-weight:bold;">[Loader Error] プログラムの読み込みに失敗しました。<br>${err.message}</div>`;
        });
    </script>
</head>
<!-- 画面UIは一切持たない（Minimal Loader規格準拠）。dom.js によって自動的に構築される -->
<body></body>
</html>
